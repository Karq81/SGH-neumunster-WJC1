<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>SG Handball Neumünster WJC1</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1b2330; --muted: #5d6878;
    --accent: #d62839; --accent-dark: #a91e2c; --border: #d9dee6; --ok: #1f8a4c; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --card: #1a202a; --text: #e8ecf2; --muted: #9aa5b5; --border: #2c3442; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .lang { display: flex; justify-content: flex-end; gap: 6px; }
  .lang button { border: 1px solid var(--border); background: var(--card); color: var(--muted);
                 border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: pointer; }
  .lang button.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  header { position: relative; text-align: center; margin: 12px 0 20px; padding: 22px 12px 18px;
           border-radius: 16px; overflow: hidden; isolation: isolate; }
  header::before { content: ''; position: absolute; inset: 0; z-index: -2;
           background: url(team-bg.jpg) center 35% / cover no-repeat; opacity: .8; }
  header::after { content: ''; position: absolute; inset: 0; z-index: -1;
           background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 15%, transparent) 0%, color-mix(in srgb, var(--bg) 40%, transparent) 55%, var(--bg) 100%); }
  header h1 { text-shadow: 0 1px 2px var(--bg), 0 0 12px var(--bg); }
  header .club { color: var(--text); font-weight: 600; text-shadow: 0 0 8px var(--bg); }
  .logo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 12px rgba(0,0,0,.35); border: 3px solid #fff; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  .club { color: var(--muted); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 17px; margin: 0 0 8px; }
  .card p, .card li { color: var(--muted); margin: 0 0 8px; }
  .card ul { padding-left: 20px; margin: 0; }
  .card p.ask { color: var(--text); font-weight: 600; margin: 12px 0 0; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 14px; }
  input[type=text], input[type=email] {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-weight: 400; color: var(--muted); font-size: 14px; }
  .check input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
  .hp { position: absolute; left: -9999px; }
  button.submit { width: 100%; margin-top: 20px; padding: 14px; font-size: 17px; font-weight: 600;
                  color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button.submit:hover { background: var(--accent-dark); }
  button.submit:disabled { opacity: .6; cursor: wait; }
  .echeck { display: none; margin-top: 8px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .echeck.ok { display: block; background: rgba(31,138,76,.12); color: var(--ok); }
  .echeck.bad { display: block; background: rgba(192,57,43,.1); color: var(--err); }
  .echeck.warn { display: block; background: rgba(230,145,0,.14); color: var(--text); border: 1px solid rgba(230,145,0,.6); }
  .echeck button { margin-top: 8px; padding: 6px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .echeck label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0; font-weight: 600; }
  .echeck label input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
  .roles { display: grid; gap: 8px; margin-top: 6px; }
  .role { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--border);
          border-radius: 10px; background: var(--bg); cursor: pointer; font-weight: 600; margin: 0; }
  .role input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
  .role .ico { font-size: 24px; }
  .role:has(input:checked) { border-color: var(--accent); background: rgba(214,40,57,.08); }
  .role-note { margin: 8px 0 0; font-size: 14px; color: var(--muted); display: none; }
  .contact { margin: 12px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); }
  .card .contact p { margin: 0; color: var(--text); }
  .contact a, .privacy a { color: var(--accent); font-weight: 600; word-break: break-all; }
  .privacy { font-size: 14px; }
  .privacy summary { cursor: pointer; font-weight: 700; font-size: 16px; }
  .privacy h3 { font-size: 15px; margin: 14px 0 4px; }
  .privacy p { margin: 0 0 6px; }
  .visits { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 0; min-height: 18px; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; }
  .msg.err { display: block; background: rgba(192,57,43,.1); color: var(--err); }
  .done { text-align: center; display: none; }
  .done .big { font-size: 48px; }
  .done h2 { font-size: 20px; }
  .demo { background: #fff3cd; color: #6b5300; border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-bottom: 12px; display: none; }

  /* Instrukcja: jak znaleźć maila konta YouTube */
  .howto-btn { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; padding: 14px 16px;
               background: rgba(214,40,57,.08); border: 2px solid var(--accent); border-radius: 12px;
               color: var(--text); font-size: 18px; font-weight: 700; line-height: 1.3; text-align: left; cursor: pointer; }
  .howto-btn .ico { font-size: 30px; flex: none; }
  .howto-btn .arrow { margin-left: auto; color: var(--accent); font-size: 22px; transition: transform .2s; }
  .howto-btn[aria-expanded="true"] .arrow { transform: rotate(90deg); }
  .howto { display: none; margin-top: 10px; padding: 18px 14px; border-width: 2px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
  .howto.open { display: block; }
  .phone { width: 250px; height: 360px; margin: 0 auto; border: 8px solid #222; border-radius: 26px; background: #fff;
           position: relative; overflow: hidden; color: #0f0f0f; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .scr { position: absolute; inset: 0; opacity: 0; transition: opacity .4s; }
  .scr.on { opacity: 1; }
  .yt-top { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px; border-bottom: 1px solid #eee; }
  .yt-logo { width: 22px; height: 15px; background: #f00; border-radius: 4px; position: relative; }
  .yt-logo::after { content: ''; position: absolute; left: 8px; top: 4px; border-left: 7px solid #fff; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
  .yt-word { font-weight: 700; font-size: 13px; letter-spacing: -.3px; }
  .yt-sp { flex: 1; }
  .av { width: 24px; height: 24px; border-radius: 50%; background: #6a5acd; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 11px; }
  .av.big { width: 46px; height: 46px; font-size: 18px; }
  .vid { margin: 8px 10px 0; height: 62px; border-radius: 8px; background: #e6e6e6; }
  .vtxt { margin: 5px 10px 0; height: 7px; width: 70%; border-radius: 4px; background: #eee; }
  .navbar { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 7px 0; border-top: 1px solid #eee; background: #fff; font-size: 10px; color: #555; }
  .navbar span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ring { position: relative; }
  .ring::before { content: ''; position: absolute; inset: -6px; border: 3px solid var(--accent); border-radius: 999px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .5; } }
  .finger { position: absolute; font-size: 26px; animation: tap 1.2s infinite; pointer-events: none; }
  @keyframes tap { 0%,100% { transform: translate(6px,6px); } 50% { transform: translate(0,0); } }
  .prof { padding: 16px 12px; display: flex; gap: 10px; align-items: center; }
  .prof b { display: block; font-size: 13px; }
  .prof small { color: #606060; }
  .switch { display: inline-block; margin-top: 4px; color: #065fd4; font-weight: 600; padding: 2px 4px; border-radius: 6px; }
  .menu-line { margin: 8px 12px; height: 9px; border-radius: 4px; background: #eee; }
  .acc-h { padding: 12px; font-weight: 700; font-size: 13px; border-bottom: 1px solid #eee; }
  .acc { display: flex; gap: 8px; align-items: center; padding: 12px; }
  .acc .mail { display: inline-block; margin-top: 3px; font-size: 10px; color: #0f0f0f; font-weight: 700; background: #fff3a3; padding: 2px 4px; border-radius: 4px; }
  .acc small { color: #606060; display: block; }
  .ic { font-size: 12px; margin-left: 6px; }
  .ic.ring::before { inset: -5px; }
  .chips { display: flex; gap: 5px; padding: 6px 10px 0; font-size: 10px; }
  .chips b, .chips span { padding: 3px 7px; border-radius: 6px; background: #eee; }
  .chips b { background: #0f0f0f; color: #fff; }
  .pill { font-size: 10px; border: 1px solid #ccc; border-radius: 999px; padding: 2px 8px; }
  .btnrow { padding: 0 12px; }
  .btnrow .dark { display: inline-block; background: #0f0f0f; color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 11px; font-weight: 600; }
  .sect { padding: 12px 12px 4px; font-weight: 700; font-size: 13px; }
  .thumbs { display: flex; gap: 6px; padding: 0 12px; }
  .thumbs i { flex: 1; height: 44px; border-radius: 6px; background: #e6e6e6; }
  .set-h { padding: 12px; font-size: 14px; font-weight: 600; }
  .set-sub { padding: 6px 12px; font-weight: 700; font-size: 12px; }
  .set-row { padding: 9px 12px; font-size: 12px; }
  .set-row.hl { margin: 0 6px; border-radius: 8px; background: #fff3a3; font-weight: 700; }
  .set-row.ring::before { inset: -2px; border-radius: 10px; }
  .scr.dim { background: rgba(0,0,0,.45); }
  .dlg { position: absolute; left: 14px; right: 14px; top: 44px; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .dlg-h { display: flex; justify-content: space-between; padding: 12px 12px 6px; font-size: 13px; font-weight: 600; }
  .dlg-top { padding: 4px 12px 10px; font-size: 11px; border-bottom: 1px solid #eee; line-height: 1.6; }
  .dlg-top .mail { position: relative; display: inline-block; background: #fff3a3; font-weight: 700; padding: 1px 4px; border-radius: 4px; }
  .dlg-top .mail.ring::before { inset: -4px; border-radius: 8px; }
  .tick { margin-left: auto; color: #065fd4; font-weight: 700; }
  .dlg-l { padding: 10px 12px 12px; font-size: 11px; border-top: 1px solid #eee; color: #333; }
  .howto .stepcap { color: var(--text); text-align: center; margin: 16px 0 10px; font-size: 19px; font-weight: 700; line-height: 1.4; min-height: 80px; }
  .stepnav { display: flex; justify-content: center; align-items: center; gap: 10px; }
  .stepnav button { border: 2px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 20px; font-size: 20px; cursor: pointer; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--border); }
  .dots i.on { background: var(--accent); }
  .howto .extra { font-size: 16px; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang">
    <button type="button" data-lang="de">DE</button>
    <button type="button" data-lang="pl">PL</button>
  </div>

  <header>
    <img class="logo" src="logo.jpg" alt="" width="96" height="96">
    <h1 data-t="title"></h1>
    <p class="club" id="club"></p>
  </header>

  <div class="demo" id="demo" data-t="demo"></div>

  <section class="card">
    <h2 data-t="whyTitle"></h2>
    <p data-t="why1"></p>
    <p data-t="why2"></p>
    <ul>
      <li data-t="b1"></li>
      <li data-t="b2"></li>
      <li data-t="b3"></li>
    </ul>
  </section>

  <section class="card">
    <h2 data-t="whoTitle"></h2>
    <p data-t="who1"></p>
    <p data-t="who2"></p>
    <div class="contact">
      <p><strong>Michał Karczewski</strong></p>
      <p><a href="mailto:karczek1981@gmail.com">karczek1981@gmail.com</a></p>
      <p data-t="contactNote" style="margin-top:6px;color:var(--muted)"></p>
    </div>
  </section>

  <section class="card">
    <h2 data-t="privTitle"></h2>
    <p data-t="priv1"></p>
    <ul>
      <li data-t="p1"></li>
      <li data-t="p2"></li>
      <li data-t="p3"></li>
      <li data-t="p4"></li>
    </ul>
    <p class="ask" data-t="privAsk"></p>
  </section>

  <section class="card" id="formCard">
    <form id="form" novalidate>
      <label data-t="roleQ" style="margin-top:0"></label>
      <div class="roles" role="radiogroup">
        <label class="role"><input type="radio" name="role" value="parent"><span class="ico">👨‍👩‍👧</span><span data-t="roleParent"></span></label>
        <label class="role"><input type="radio" name="role" value="player"><span class="ico">🤾‍♀️</span><span data-t="rolePlayer"></span></label>
        <label class="role"><input type="radio" name="role" value="fan"><span class="ico">📣</span><span data-t="roleFan"></span></label>
      </div>
      <p class="role-note" id="playerNote" data-t="playerNote"></p>

      <label for="firstName" data-t="firstName"></label>
      <input type="text" id="firstName" autocomplete="given-name" required maxlength="60">

      <label for="lastName"><span data-t="lastName"></span> <span class="hint" data-t="optional"></span></label>
      <input type="text" id="lastName" autocomplete="family-name" maxlength="60">

      <label for="email"><span data-t="email"></span><br><span class="hint" data-t="emailHint"></span></label>
      <input type="email" id="email" autocomplete="email" inputmode="email" required maxlength="120" placeholder="name@gmail.com">
      <div class="echeck" id="echeck" role="status"></div>

      <button type="button" class="howto-btn" id="howtoBtn" aria-expanded="false"><span class="ico">📱</span><span data-t="howtoBtn"></span><span class="arrow">›</span></button>
      <div class="howto" id="howto">
        <div class="phone" aria-hidden="true">
          <!-- 1: Startseite -> Mein YouTube -->
          <div class="scr on">
            <div class="yt-top"><div class="yt-logo"></div><span class="yt-word">YouTube</span><span class="yt-sp"></span><span class="ic">💬</span><span class="ic">🔔</span><span class="ic">🔍</span></div>
            <div class="chips"><b>Alle</b><span>Gaming</span><span>News</span></div>
            <div class="vid"></div><div class="vtxt"></div><div class="vid"></div><div class="vtxt"></div>
            <div class="navbar"><span>⌂<em data-t="navHome"></em></span><span>▶<em>Shorts</em></span><span>＋</span><span>▤<em data-t="navSubs"></em></span><span class="ring"><b class="av" style="width:18px;height:18px;font-size:10px">M</b><em data-t="you"></em></span></div>
            <div class="finger" style="right:4px;bottom:0">👆</div>
          </div>
          <!-- 2: Profil -> Zahnrad -->
          <div class="scr">
            <div class="yt-top"><span class="pill">Konten ⌄</span><span class="yt-sp"></span><span class="ic">🔔</span><span class="ic">🔍</span><span class="ic ring">⚙️</span></div>
            <div class="prof"><div class="av big">M</div><div><b>Max Mustermann</b><small>@maxmuster</small></div></div>
            <div class="btnrow"><span class="dark" data-t="toChannel"></span></div>
            <div class="sect" data-t="history"></div>
            <div class="thumbs"><i></i><i></i><i></i></div>
            <div class="finger" style="right:2px;top:26px">👆</div>
          </div>
          <!-- 3: Einstellungen -> Konto wechseln oder verwalten -->
          <div class="scr">
            <div class="set-h">← <span data-t="settings"></span></div>
            <div class="set-sub" data-t="account"></div>
            <div class="set-row">⚙️ <span data-t="general"></span></div>
            <div class="set-row ring hl">👤 <span data-t="switchAcc"></span></div>
            <div class="set-row">👪 <span data-t="family"></span></div>
            <div class="set-row">🔤 <span data-t="languages"></span></div>
            <div class="set-row">📊 <span data-t="timeMgmt"></span></div>
            <div class="finger" style="left:150px;top:128px">👆</div>
          </div>
          <!-- 4: Konten-Fenster mit E-Mail -->
          <div class="scr dim">
            <div class="dlg">
              <div class="dlg-h"><span data-t="accounts"></span><span>＋</span></div>
              <div class="dlg-top"><span>Max Mustermann</span><br><span class="mail ring">max.mustermann@gmail.com</span></div>
              <div class="acc"><div class="av">M</div><div style="min-width:0"><b>Max Mustermann</b><br><small>@maxmuster</small></div><span class="tick">✓</span></div>
              <div class="dlg-l" data-t="manageGoogle"></div>
            </div>
          </div>
        </div>
        <p class="stepcap" id="stepcap"></p>
        <div class="stepnav">
          <button type="button" id="prevStep">‹</button>
          <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
          <button type="button" id="nextStep">›</button>
        </div>
        <p class="extra" data-t="howtoPc"></p>
      </div>

      <div id="childWrap">
        <label for="child"><span data-t="child"></span> <span class="hint" data-t="optional"></span></label>
        <input type="text" id="child" maxlength="120">
      </div>

      <input type="text" id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <label class="check" id="parentWrap" style="display:none"><input type="checkbox" id="parentOk"><span data-t="parentOk"></span></label>
      <label class="check"><input type="checkbox" id="consent"><span data-t="consent"></span></label>

      <button class="submit" type="submit" data-t="send"></button>
      <div class="msg" id="msg" role="alert"></div>
    </form>

    <div class="done" id="done">
      <div class="big">✅</div>
      <h2 data-t="thanks"></h2>
      <p data-t="thanks2"></p>
    </div>
  </section>

  <section class="card privacy">
    <details>
      <summary data-t="privHead"></summary>
      <h3 data-t="pv1h"></h3><p>Michał Karczewski · <a href="mailto:karczek1981@gmail.com">karczek1981@gmail.com</a></p>
      <h3 data-t="pv2h"></h3><p data-t="pv2"></p>
      <h3 data-t="pv3h"></h3><p data-t="pv3"></p>
      <h3 data-t="pv4h"></h3><p data-t="pv4"></p>
      <h3 data-t="pv5h"></h3><p data-t="pv5"></p>
      <h3 data-t="pv6h"></h3><p data-t="pv6"></p>
    </details>
  </section>
  <p class="visits" id="visits"></p>
</div>

<script>
  // ===== USTAWIENIA =====

    // Adres aplikacji Apps Script (kończy się na /exec). Pusty = tryb podglądu, nic nie jest wysyłane.
    scriptUrl: 'https://script.google.com/macros/s/AKfycbz-dK0Wx3GqhJhLmrDdewsHonDHrrvxmO21HEyNrO4ootZdHdYJ63rQp7WgchLHVpA/exec',
    clubName: 'SG Handball Neumünster WJC1 · 2026/27',
  };
  // ======================

  const T = {
    de: {
      title: 'Spielvideos unserer Mannschaft',
      demo: 'Vorschau – das Formular ist noch nicht verbunden, es wird nichts gespeichert.',
      whyTitle: 'Worum geht es?',
      why1: 'Wir filmen die Spiele und Turniere unserer Mannschaft und zeigen sie live oder als Aufzeichnung auf YouTube – aber nur privat, nicht öffentlich.',
      why2: 'Private YouTube-Videos können nur Personen sehen, die wir per E-Mail eingeladen haben. Dafür brauchen wir die E-Mail-Adresse Ihres Google-/YouTube-Kontos.',
      b1: 'Sie müssen sich hier nirgendwo anmelden und kein Passwort eingeben.',
      b2: 'Zum Anschauen müssen Sie in YouTube mit genau diesem Konto angemeldet sein.',
      b3: 'Die Daten nutzen wir nur dafür und geben sie nicht weiter. Löschung jederzeit auf Wunsch beim Trainer.',
      whoTitle: 'Wer macht das – und für wen?',
      who1: 'Ich bin selbst Vater einer Spielerin und filme die Spiele ehrenamtlich und privat – ohne kommerzielles Interesse, ohne Werbung, ohne Geld. Die Videos sind ausschließlich für unsere Mannschaft da: für die Spielerinnen, für uns Eltern und gerne auch für Großeltern und Familie.',
      who2: 'Mir ist wichtig, dass dabei alles rechtlich sauber und im Sinne des Datenschutzes abläuft und niemand Probleme bekommt. Genau deshalb gibt es diese Form: private Videos, Zugang nur für eingetragene Personen, und die Daten werden nur dafür verwendet.',

  let lang = 'de';
  try { lang = localStorage.getItem('lang') || ((navigator.language || '').startsWith('pl') ? 'pl' : 'de'); } catch (e) {}

  const $ = id => document.getElementById(id);
  const t = k => T[lang][k];

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    document.title = t('title');
    if (document.getElementById('echeck')) checkEmail();
    if (typeof showVisits === 'function' && document.getElementById('visits')) showVisits();
    if (document.getElementById('stepcap')) document.getElementById('stepcap').textContent = t('step' + (step + 1));
  }

  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('lang', lang); } catch (e) {}
    render();
  }));


  // Instrukcja krok po kroku (automatycznie przewija się co 4 s)
  let step = 0, timer = null;
  const scrs = document.querySelectorAll('.scr'), dots = document.querySelectorAll('.dots i');
  function showStep(n) {
    step = (n + scrs.length) % scrs.length;
    scrs.forEach((el, i) => el.classList.toggle('on', i === step));
    dots.forEach((el, i) => el.classList.toggle('on', i === step));
    $('stepcap').textContent = t('step' + (step + 1));
  }
  function autoplay() { clearInterval(timer); timer = setInterval(() => showStep(step + 1), 4000); }
  $('howtoBtn').addEventListener('click', () => {
    const open = $('howto').classList.toggle('open');
    $('howtoBtn').setAttribute('aria-expanded', open);
    if (open) { showStep(0); autoplay(); } else clearInterval(timer);
  });
  $('prevStep').addEventListener('click', () => { showStep(step - 1); autoplay(); });
  $('nextStep').addEventListener('click', () => { showStep(step + 1); autoplay(); });

  // Sprawdzanie maila: YouTube działa tylko z adresem konta Google (prawie zawsze @gmail.com).
  const GOOGLE_DOMAINS = ['gmail.com', 'googlemail.com'];
  const GMAIL_TYPOS = /^(g?mai?l|gmial|gmali|gamil|gmaill|gnail|gmal|gmeil|gemail|googlemail|gmail)\.(com|de|pl|co|cm|con|om|comm|cmo|c|net|org)$|^gmail\.[a-z]+$/;
  let emailState = 'empty', confirmedEmail = '';
  function checkEmail() {
    const box = $('echeck');
    const v = $('email').value.trim().toLowerCase();
    box.className = 'echeck';
    box.replaceChildren();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { emailState = v ? 'invalid' : 'empty'; return; }
    const [user, domain] = v.split('@');
    if (GOOGLE_DOMAINS.includes(domain)) {
      emailState = 'ok';
      box.className = 'echeck ok';
      box.textContent = t('emailOk');
    } else if (GMAIL_TYPOS.test(domain)) {
      emailState = 'typo';
      const fixed = user + '@gmail.com';
      box.className = 'echeck bad';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = t('emailFix');
      btn.addEventListener('click', () => { $('email').value = fixed; checkEmail(); });
      box.append(t('emailTypo').replace('{s}', fixed), document.createElement('br'), btn);
    } else {
      emailState = 'other';
      box.className = 'echeck warn';
      const lbl = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'emailConfirm';
      cb.checked = confirmedEmail === v;
      cb.addEventListener('change', () => { confirmedEmail = cb.checked ? v : ''; });
      lbl.append(cb, document.createTextNode(t('emailWarnConfirm')));
      box.append(t('emailWarn').replace('{d}', '@' + domain), lbl);
    }
  }
  $('email').addEventListener('input', checkEmail);

  // Rola: zawodniczka nie podaje imienia dziecka
  const ROLE_TAG = { parent: '[Rodzic]', player: '[Zawodniczka]', fan: '[Kibic]' };
  function currentRole() { const r = document.querySelector('input[name=role]:checked'); return r ? r.value : ''; }
  document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', () => {
    const player = currentRole() === 'player';
    $('childWrap').style.display = player ? 'none' : '';
    $('playerNote').style.display = player ? 'block' : 'none';
    $('parentWrap').style.display = player ? 'flex' : 'none';
  }));

  // Licznik wejść: raz na otwarcie strony w danej karcie (odświeżanie nie nabija)
  let visitTotal = null;
  function showVisits() { if (visitTotal != null) $('visits').textContent = t('visitsLabel').replace('{n}', visitTotal); }
  (async () => {
    if (!CONFIG.scriptUrl) return;
    try { if (sessionStorage.getItem('counted') === '1') return; } catch (e) {}
    try {
      const res = await fetch(CONFIG.scriptUrl, { method: 'POST', body: JSON.stringify({ action: 'visit' }) });
      const out = await res.json();
      if (out.ok && out.visits) {
        visitTotal = out.visits.total;
        try { sessionStorage.setItem('counted', '1'); sessionStorage.setItem('visitTotal', visitTotal); } catch (e) {}
        showVisits();
      }
    } catch (e) {}
  })();
  try { const v = sessionStorage.getItem('visitTotal'); if (v) { visitTotal = v; } } catch (e) {}

  $('club').textContent = CONFIG.clubName;
  if (!CONFIG.scriptUrl) $('demo').style.display = 'block';
  render();

  function showError(key) {
    const m = $('msg');
    m.textContent = t(key);
    m.className = 'msg err';
  }

  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('msg').className = 'msg';
    const data = {
      firstName: $('firstName').value.trim(),
      lastName: $('lastName').value.trim(),
      email: $('email').value.trim(),
      child: '',
      consent: $('consent').checked,
      website: $('website').value,
    };
    const role = currentRole();
    if (!role) return showError('errRole');
    const childName = role === 'player' ? '' : $('child').value.trim();
    data.child = (ROLE_TAG[role] + ' ' + childName).trim();
    if (!data.firstName) return showError('errName');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return showError('errEmail');
    checkEmail();
    if (emailState === 'typo') return showError('errEmailTypo');
    if (emailState === 'other' && confirmedEmail !== data.email.toLowerCase()) return showError('errEmailConfirm');
    if (role === 'player' && !$('parentOk').checked) return showError('errParent');
    if (!data.consent) return showError('errConsent');

    const btn = ev.submitter || document.querySelector('.submit');
    btn.disabled = true;
    btn.textContent = t('sending');
    try {
      if (CONFIG.scriptUrl) {
        // Zwykły tekst (bez nagłówka JSON), żeby przeglądarka nie robiła zapytania wstępnego CORS do Google.
        const res = await fetch(CONFIG.scriptUrl, { method: 'POST', body: JSON.stringify(data) });
        const out = await res.json();
        if (!out.ok) {
          const map = { name: 'errName', email: 'errEmail', consent: 'errConsent' };
          throw new Error(map[out.error] || 'errServer');
        }
      } else {
        await new Promise(r => setTimeout(r, 600));
      }
      $('form').style.display = 'none';
      $('done').style.display = 'block';
    } catch (err) {
      showError(T[lang][err.message] ? err.message : 'errServer');
      btn.disabled = false;
      btn.textContent = t('send');
    }
  });
</script>
